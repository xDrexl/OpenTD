name: Cross-platform release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "export_presets.cfg"
      - "project.godot"
      - "OpenTD.csproj"
      - "src/**"
      - "scenes/**"
      - "assets/**"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

  export:
    name: Export Windows and macOS
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Export Godot releases
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_linux_x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          archive_root_folder: true
          cache: true

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenTD-${{ github.run_id }}
          path: ${{ steps.export.outputs.archive_directory }}/*
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          ${{ steps.export.outputs.archive_directory }}/*
          --verify-tag
          --generate-notes
          --title "OpenTD ${{ github.ref_name }}"
